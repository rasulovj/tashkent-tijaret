<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taşkent Ticaret Paneli</title>
<style>
  :root {
    --red: #8B1A1A; --red-2: #741414; --red-soft: #f6e7e2; --ink: #1d1d1f; --muted: #6b6b70; --line: #e6e2dc;
    --bg: #f6f4f1; --card: #fff; --warn: #a35f00; --warn-bg: #fff3d6; --ok: #1e7a3c; --ok-bg: #e4f3e9;
    --blue: #2f6db5; --nav: #241a1a; --nav-ink: #d9cfcc; --nav-active: #3a2828;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); display: flex; }
  a { color: var(--red); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 13px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover { border-color: #cbc5bd; }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.primary:hover { background: var(--red-2); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 5px 9px; }
  button.ghost:hover { background: #eeeae5; color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea, select { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #e8c1b6; border-color: var(--red); }
  textarea { resize: none; overflow: hidden; line-height: 1.5; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Sol menü ---------- */
  nav.side { width: 228px; flex: none; background: var(--nav); color: var(--nav-ink); display: flex; flex-direction: column; padding: 16px 10px; height: 100vh; position: sticky; top: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .brand .mark { width: 36px; height: 36px; border-radius: 9px; background: var(--red); color: #fff; display: grid; place-items: center; font: bold italic 15px Georgia, serif; flex: none; }
  .brand b { display: block; color: #fff; font: bold italic 15px Georgia, serif; }
  .brand small { color: #a99c98; font-size: 11.5px; }
  .menu a { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 8px; color: var(--nav-ink); text-decoration: none; margin-bottom: 2px; position: relative; }
  .menu a:hover { background: #2f2222; color: #fff; }
  .menu a.on { background: var(--nav-active); color: #fff; }
  .menu a.on::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: #e0735f; }
  .menu .cnt { margin-left: auto; font-size: 11px; background: #3d2c2c; color: #e9dcd8; border-radius: 99px; padding: 1px 7px; }
  .menu .cnt.warn { background: #6b4a12; color: #ffe1a6; }
  .side .foot { margin-top: auto; padding: 10px 6px 0; border-top: 1px solid #3a2c2c; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #b9aeab; margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4cc27a; box-shadow: 0 0 0 0 rgba(76,194,122,.6); animation: pulse 2s infinite; flex: none; }
  .dot.off { background: #c05a4a; animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(76,194,122,0); } 100% { box-shadow: 0 0 0 0 rgba(76,194,122,0); } }
  .side .who { background: #2f2222; border-color: #3d2c2c; color: #fff; font-size: 13px; }
  .side .who::placeholder { color: #9d8f8b; }

  .menu a small { display: block; font-size: 11px; color: #9d8f8b; margin-top: 1px; }
  .menu a.on small { color: #c9bab6; }
  .subnav { display: flex; gap: 4px; padding: 0 22px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
  .subnav a { padding: 10px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-size: 13.5px; }
  .subnav a.on { color: var(--red); border-bottom-color: var(--red); font-weight: 600; }
  .subnav:empty { display: none; }
  .keybox { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  /* ---------- Üst çubuk ---------- */
  .app { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  header.top { display: flex; align-items: center; gap: 10px; padding: 12px 22px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
  header.top h1 { margin: 0; font-size: 18px; }
  header.top .sub { color: var(--muted); font-size: 12.5px; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: #eeeae5; color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.blue { background: #e6eef9; color: var(--blue); }
  .spacer { flex: 1; }
  #view { flex: 1; overflow: auto; min-height: 0; }
  .page { display: none; padding: 20px 22px 40px; }
  .page.on { display: block; }
  .page.full { padding: 0; height: 100%; }
  .page.full.on { display: flex; }

  /* ---------- Kartlar ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card h3 .spacer { flex: 1; }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .kpi .l { color: var(--muted); font-size: 12.5px; }
  .kpi .s { font-size: 12px; margin-top: 4px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 14px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .empty { color: var(--muted); padding: 50px 20px; text-align: center; }

  .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; margin: 4px 0 2px; }
  .step { position: relative; text-align: center; padding: 0 4px; cursor: pointer; }
  .step .c { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; background: #eeeae5; color: var(--muted); font-weight: 700; position: relative; z-index: 1; border: 2px solid var(--card); }
  .step.done .c { background: var(--ok); color: #fff; }
  .step.warn .c { background: #e9a23b; color: #fff; }
  .step.now .c { background: var(--red); color: #fff; box-shadow: 0 0 0 4px var(--red-soft); }
  .step::after { content: ""; position: absolute; top: 17px; left: 50%; width: 100%; height: 2px; background: var(--line); }
  .step:last-child::after { display: none; }
  .step.done::after { background: #9fd3b2; }
  .step .t { font-weight: 600; font-size: 13px; }
  .step .d { color: var(--muted); font-size: 11.5px; line-height: 1.3; }

  .bars .row { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 7px; font-size: 13px; }
  .bars .track { background: #f0ece7; border-radius: 6px; height: 12px; overflow: hidden; }
  .bars .fill { height: 100%; border-radius: 6px; background: #c9a99b; }
  .bars .fill.hl { background: var(--red); }
  .bars .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .hl-list .row { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; padding: 8px 4px; border-bottom: 1px solid #f0ece7; cursor: pointer; align-items: start; }
  .hl-list .row:hover { background: #faf8f6; }
  .hl-list .row:last-child { border-bottom: 0; }
  .hl-list .n { color: var(--red); font-weight: 700; text-align: right; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #f1ede8; color: #5c5650; margin: 2px 3px 0 0; white-space: nowrap; }
  .tl div { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .tl div:last-child { border-bottom: 0; }
  .tl .when { color: var(--muted); font-size: 12px; }

  /* ---------- Editör ---------- */
  #p-editor.on { display: grid; grid-template-columns: 290px minmax(0, 1fr); }
  .list-col { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px; background: #f9f7f5; }
  h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 4px 8px; display: flex; justify-content: space-between; align-items: center; }
  .item { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: start; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
  .item:hover { background: #efebe6; }
  .item.sel { background: var(--card); border-color: var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item.drag-over { border-top: 2px solid var(--red); }
  .item .n { font-weight: 600; color: var(--red); text-align: right; }
  .item .h { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; }
  .item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
  .cand { padding: 8px; border-radius: 8px; font-size: 12.5px; display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start; }
  .cand:hover { background: #efebe6; }
  .cand .meta { font-size: 11px; color: var(--muted); }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  .work { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .seg { display: inline-flex; background: #eeeae5; border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
  .work-bar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--card); flex: none; flex-wrap: wrap; }
  .work-body { flex: 1; min-height: 0; display: grid; }
  .work-body > div { overflow-y: auto; min-height: 0; }
  #ed-form { padding: 16px 22px 50px; }
  #ed-source { padding: 14px 16px; background: var(--card); display: none; }
  #ed-preview { display: none; }
  #ed-preview iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .work.m-source #ed-form, .work.m-preview #ed-form { display: none; }
  .work.m-source #ed-source { display: block; }
  .work.m-preview #ed-preview { display: block; overflow: hidden; }
  @media (min-width: 1280px) {
    .work.m-edit .work-body { grid-template-columns: minmax(0, 1fr) 400px; }
    .work.m-edit #ed-source { display: block; border-left: 1px solid var(--line); }
  }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  #headline { font: 600 18px/1.35 Georgia, "Times New Roman", serif; }
  .para { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 8px; }
  .para textarea { font: 15px/1.55 "Times New Roman", Times, serif; text-align: justify; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .src-row { display: grid; grid-template-columns: 140px 1fr auto; gap: 6px; margin-bottom: 6px; }
  .warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; }
  .okbox { background: var(--ok-bg); color: var(--ok); border-radius: 9px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px; }
  .imgbox { display: flex; gap: 12px; align-items: flex-start; border: 1px dashed var(--line); border-radius: 10px; padding: 10px; }
  .imgbox img { width: 180px; border-radius: 6px; border: 1px solid var(--line); }
  .srcdoc h3 { font-size: 14px; margin: 0 0 4px; }
  .srcdoc .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .srcdoc .txt { white-space: pre-wrap; font-size: 13px; line-height: 1.55; }
  .srcdoc + .srcdoc { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
  mark { background: #fde9a8; border-radius: 3px; padding: 0 1px; }
  mark.used { background: #cdebd6; }

  /* ---------- Haber akışı ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters input { max-width: 280px; }
  .fchip { border-radius: 99px; padding: 5px 12px; font-size: 12.5px; }
  .fchip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .news { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 0; margin-bottom: 8px; overflow: hidden; }
  .hz { display: grid; grid-template-columns: minmax(230px, 1.2fr) minmax(210px, 1fr) minmax(220px, 1fr); gap: 12px; align-items: stretch; overflow-x: auto; }
  .hz-col { background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 420px; min-width: 0; }
  #p-hazirla { padding: 14px 14px 10px; }
  .hz-col > header { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .hz-col > header h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .hz-col > header .n { background: var(--red); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .hz-body { overflow: auto; padding: 10px 12px; flex: 1; }
  .hz-news { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
  .hz-news.in { opacity: .55; }
  .hz-news .tt { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .hz-news .sm { font-size: 13px; color: var(--ink); margin-top: 4px; line-height: 1.45; }
  .hz-news .mt { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .hz-news details { margin-top: 6px; font-size: 13px; }
  .hz-news details summary { cursor: pointer; color: var(--red); font-weight: 600; }
  .hz-news .ft { display: flex; justify-content: flex-end; margin-top: 8px; }
  .hz-arh { margin: 16px 0 8px; font-size: 13px; display: flex; gap: 6px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 12px; }
  .hz-ar { display: flex; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: #fff; }
  .hz-ar img { width: 74px; flex: none; border-radius: 4px; box-shadow: 0 1px 3px #0002; cursor: zoom-in; align-self: flex-start; }
  .hz-ar.new { flex-direction: column; border-color: var(--ok); background: #f6fbf7; }
  .hz-ar.new img { width: 100%; max-height: 240px; object-fit: cover; object-position: top; }
  .hz-ar .m { min-width: 0; flex: 1; } .hz-ar .m b { font-size: 13px; word-break: break-word; }
  .hz-ar .nw { background: var(--ok); color: #fff; border-radius: 8px; padding: 1px 7px; font-size: 11px; }
  .hz-done { border: 1px solid var(--ok); background: #f1faf4; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .hz-it { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: #fff; }
  .hz-it .no { font-weight: 700; color: var(--red); font-size: 15px; }
  .hz-it .h { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
  .hz-it .mm { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .hz-it .wr { font-size: 12px; color: var(--warn); margin-top: 4px; }
  .hz-it .bt { display: flex; flex-direction: column; gap: 2px; }
  .hz-it .bt button { padding: 2px 8px; font-size: 12px; }
  .hz-big { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
  .hz-pages img { width: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.06); cursor: zoom-in; }
  .hz-pages .pg { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 12px; }
  @media (max-width: 1100px) { .hz-it img { display: none; } .hz-news img { width: 64px !important; height: 46px !important; } .hz-big { font-size: 13.5px; padding: 10px 8px; } #hz-lang button { padding: 4px 8px; } .hz-news { padding: 8px 10px; } }
  .dash-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .dash-top .hint { flex: 1; }
  .dash-top button { padding: 9px 16px; }
  .dash-k4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .dk { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 104px; transition: border-color .15s; }
  .dk:hover { border-color: var(--red); }
  .dk-l { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .dk-v { font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .dk-s { font-size: 12.5px; color: var(--muted); margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dk-s a { color: var(--red); font-weight: 600; }
  .dash-c2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .dash-ch { margin: 0; height: 270px; display: flex; flex-direction: column; }
  .dchart { display: flex; align-items: flex-end; gap: 8px; flex: 1; padding-top: 6px; }
  .dcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .dcol i { display: block; width: 70%; max-width: 30px; background: var(--red); border-radius: 4px 4px 0 0; }
  .dcol:hover i { opacity: .8; }
  .dcol .dn { font-size: 12px; color: var(--ink); font-weight: 600; }
  .dcol .dl { font-size: 11px; color: var(--muted); }
  .dbars { display: flex; flex-direction: column; gap: 9px; flex: 1; justify-content: center; }
  .db { display: grid; grid-template-columns: 34% 1fr 30px; gap: 10px; align-items: center; font-size: 13px; }
  .dbn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dbt { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .dbt i { display: block; height: 100%; background: var(--red); border-radius: 5px; }
  .db b { text-align: right; font-weight: 600; font-size: 12.5px; }
  @media (max-width: 760px) { .dash-k4, .dash-c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dash-c2 { grid-template-columns: 1fr; } }
  /* ---------- Simgeler ---------- */
  header.top h1 { display: flex; align-items: center; gap: 10px; }
  .pg-ico { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #d8432f, #8b1a1a); display: grid; place-items: center; box-shadow: 0 4px 10px rgba(216,67,47,.25); flex: none; }
  .pg-ico svg.i { stroke: #fff; width: 18px; height: 18px; }
  .ico { width: 30px; height: 30px; border-radius: 9px; display: inline-grid; place-items: center; background: #f6e7e4; flex: none; }
  .ico svg.i { width: 17px; height: 17px; stroke: var(--red); }
  .ico.b { background: #e6eef8; } .ico.b svg.i { stroke: #2f6db5; }
  .ico.g { background: #e5f4ea; } .ico.g svg.i { stroke: #1e7a3c; }
  .ico.o { background: #fbefdc; } .ico.o svg.i { stroke: #a35f00; }
  .dk { position: relative; }
  .dk .ico { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 11px; }
  .dk .ico svg.i { width: 20px; height: 20px; }
  .dash-ch h3 { display: flex; align-items: center; gap: 8px; }
  .hz-col > header h3 .ico { width: 26px; height: 26px; border-radius: 8px; } .hz-col > header h3 .ico svg.i { width: 15px; height: 15px; }
  /* ---------- Yeni menü ---------- */
  nav.side { background: linear-gradient(180deg, #2b1d1d 0%, #1d1414 100%); width: 238px; padding: 18px 12px 14px; }
  .brand { padding: 2px 6px 20px; }
  .menu { display: flex; flex-direction: column; gap: 3px; }
  .menu a { gap: 12px; padding: 7px 8px; border-radius: 12px; transition: background .15s; margin: 0; }
  .menu a > svg.i { width: 38px; height: 38px; padding: 9px; border-radius: 11px; background: #382727; stroke: #eadfdb; box-sizing: border-box; transition: background .15s, box-shadow .15s; }
  .menu a:hover { background: rgba(255,255,255,.05); }
  .menu a:hover > svg.i { background: #4a3232; }
  .menu a.on { background: rgba(255,255,255,.08); }
  .menu a.on::before { display: none; }

window.ttSave = async function (href, name) {
  try {
    const u = (window.TT && TT.url) ? TT.url(href) : href;
    const blob = await (await fetch(u)).blob();
    let dl = null; try { dl = window.claude && claude.use ? await claude.use("downloads") : null; } catch (e) {}
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); return true; }
      catch (e) { if (e && e.code === "declined") return false;
        if (!["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(e && e.code)) { toast("İndirilemedi: " + (e.message || e.code), true); return false; } }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.dataset.native = "1";
    document.body.appendChild(a); a.click(); a.remove(); return true;
  } catch (e) { toast("İndirilemedi: " + e.message, true); return false; }
};

function ago(iso) {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "az önce";
  if (s < 3600) return Math.floor(s / 60) + " dk önce";
  if (s < 86400) return Math.floor(s / 3600) + " sa önce";
  return Math.floor(s / 86400) + " gün önce";
}
function fmtTime(iso) { return iso ? iso.replace("T", " ").slice(0, 16) : "—"; }
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", err ? 6000 : 2400);
}

{

async function api(path, body, quiet) {
  await TT.ready;
  if (!quiet) document.body.classList.add("busy");
  try { return await TT.api(path, body === undefined ? undefined : { ...body, who: who() }); }
  finally { if (!quiet) document.body.classList.remove("busy"); }
}

function signature(st) {
  return JSON.stringify([st.inbox_new, st.hash, st.approved, st.decks, st.autoscan && st.autoscan.last, st.files.map(f => f.name + f.modified), st.history.length,
                         st.stats, st.translations, st.images, st.drafts.items.map(i => [i.image, i.image_caption])]);
}
function load(st) {
  S = st; sig = signature(st);
  items = JSON.parse(JSON.stringify(st.drafts.items));
  sel = Math.min(sel, Math.max(items.length - 1, 0));
  setDirty(false);
  renderPage();
}
function setDirty(v) { dirty = v; $("#dirty").hidden = !v; $("#btn-save").classList.toggle("primary", v); renderChrome(); }

function needKey(kind) {
  const info = {
    anthropic: ["Claude API anahtarı", "Haber çevirisi, bülten metni ve başka dile çeviri bu anahtarla çalışır.", "anthropic_api_key", "sk-ant-…", "https://console.anthropic.com"],
    azure: ["Azure Speech anahtarı", "Canlı, doğal Türkçe ve Özbekçe seslendirme (Emel, Ahmet, Madina, Sardor) için gereklidir. Aylık 500 bin karakter ücretsizdir.", "azure_speech_key", "Azure anahtarı", "https://portal.azure.com"],
  }[kind];
  return new Promise(resolve => {
    const d = $("#dlg");
    d.innerHTML = `<h3>${info[0]} gerekli</h3><p>${info[1]}</p>
      <p class="hint">Anahtar yalnızca bu bilgisayarda saklanır. Anahtarı ${info[4].replace("https://", "")} adresinden alabilirsiniz.</p>

      <div class="row" style="justify-content:flex-end"><button id="dlg-no">Vazgeç</button><button class="primary" id="dlg-yes">Kaydet ve devam et</button></div>`;
    d.showModal();
    $("#dlg-no").onclick = () => { d.close(); resolve(false); };

function renderEditorPage() { renderList(); renderPool(); renderItemEditor(); renderSource(); if (mode === "preview") reloadPreview(); }

function renderList() {
  $("#count").textContent = items.length + " haber";
  $("#items").innerHTML = items.map((it, i) => `
    <div class="item ${i === sel ? "sel" : ""}" draggable="true" data-i="${i}">
      <div class="n">${i + 1}</div>
      <div><div class="h" data-hzi="${i}" title="Haberi oku">${esc(it.headline) || "<i>Başlıksız</i>"}</div>
        <div class="meta">${esc(it.category)} · ${esc(it.sources.map(s => s.name).join(", "))}${it.image ? " · 🖼" : ""}</div></div>
      <div>${it.warnings && it.warnings.length ? `<span class="badge" title="${esc(it.warnings.join("\n"))}">⚠ ${it.warnings.length}</span>` : ""}</div>
    </div>`).join("");
  $$(".item").forEach(el => {
    const i = +el.dataset.i;
    el.onclick = () => { sel = i; renderList(); renderItemEditor(); renderSource(); };
    el.ondragstart = e => e.dataTransfer.setData("text/plain", i);
    el.ondragover = e => { e.preventDefault(); el.classList.add("drag-over"); };
    el.ondragleave = () => el.classList.remove("drag-over");
    el.ondrop = e => {
      e.preventDefault(); el.classList.remove("drag-over");
      const from = +e.dataTransfer.getData("text/plain");
      if (from === i) return;
      const [m] = items.splice(from, 1); items.splice(i, 0, m);
      sel = i; setDirty(true); renderList(); renderItemEditor();
    };
  });
}

function renderPool() {
  const pool = S.candidates.filter(c => !items.some(it => it.candidate_ids.includes(c.cid)));
  $("#pool-count").textContent = pool.length;
  $("#cands").innerHTML = pool.map(c => `
    <div class="cand"><div><div>${esc(c.title)}</div>
      <div class="meta"><b style="color:${srcColor(c.source)}">${esc(c.source)}</b> · ${esc(c.published)} · puan ${c.score}</div></div>
      <button class="ghost" data-cid="${c.cid}" title="Bültene ekle">＋</button></div>`).join("")
    || `<div class="hint" style="padding:8px">Tüm adaylar bültende.</div>`;
  $$("#cands button").forEach(b => b.onclick = () => addCandidate(b.dataset.cid));
}

async function addCandidate(cid) {
  const c = S.candidates.find(x => x.cid === cid);
  let item;
  if (S.api) {
    try { toast("Claude haberi yazıyor…"); item = (await api("/api/write-item", { cid })).item; toast("Claude haberi yazdı"); }
    catch (e) { toast(e.message, true); return; }
  } else {
    item = { headline: c.title, paragraphs: [""], category: "diğer", candidate_ids: [cid],
             sources: [{ name: c.source, url: c.url }] };
    toast("Aday eklendi. Başlığı Türkçeleştirip metni kaynak metne bakarak yazın.");
  }
  items.push(item); sel = items.length - 1; setDirty(true);
  if (page !== "editor") location.hash = "editor"; else renderEditorPage();
}

async function loadRates() {
  try { studio.rates = await api("/api/rates", undefined, true); syncChartTexts(); renderStudioCtl(); draw(); }
  catch (e) { toast("Kur verisi alınamadı: " + e.message, true); }

function syncChartTexts() {
  if (studio.tpl !== "chart" || !studio.rates) return;
  const pts = studio.rates[studio.ccy] || [];
  const last = pts.length ? pts[pts.length - 1][1] : 0;

function wrap(ctx, text, maxW) {
  const lines = [];
  String(text).split("\n").forEach(par => {
    let line = "";
    par.split(/\s+/).forEach(word => {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; } else line = test;
    });
    lines.push(line);
  });
  return lines;
}
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function draw() {
  const cv = $("#cv"), ctx = cv.getContext("2d");
  const [W, H] = SIZES[studio.size], T = THEMES[studio.theme];
  cv.width = W; cv.height = H;
  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);
  // Üst bant ve alt çizgi
  ctx.fillStyle = T.primary; ctx.fillRect(0, 0, W, H * .11);
  ctx.fillStyle = T.accent; ctx.fillRect(W * .06, H * .905, W * .08, H * .006);

  if (studio.tpl === "news") {
    ctx.fillStyle = T.primary; ctx.fillRect(W * .06 - W * .012, H * .19, W * .005, H * .36);
  }
  if (studio.tpl === "chart") drawChart(ctx, W, H, T);
  if (studio.tpl === "board") drawBoard(ctx, W, H, T);

  studio.els.forEach(el => {
    const fs = el.size * W;
    ctx.font = `${el.weight} ${fs}px ${el.font === "serif" ? 'Georgia, "Times New Roman", serif' : '"Helvetica Neue", Helvetica, Arial, sans-serif'}`;
    ctx.fillStyle = T[el.color] || T.ink;
    ctx.textBaseline = "top";
    ctx.textAlign = el.align || "left";
    const lines = wrap(ctx, el.text, el.w * W);
    const lh = fs * (el.lh || 1.2);
    const x = el.x * W, y = el.y * H;
    lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lh));
    const bw = Math.max(...lines.map(l => ctx.measureText(l).width), 20);
    const bx = el.align === "center" ? x - bw / 2 : el.align === "right" ? x - bw : x;
    el._box = [bx - 8, y - 6, bw + 16, lines.length * lh + 12];
    if (studio.selEl === el.id) {
      ctx.save(); ctx.setLineDash([10, 6]); ctx.strokeStyle = T.accent; ctx.lineWidth = 2;
      ctx.strokeRect(...el._box); ctx.restore();
    }
  });
}

function drawChart(ctx, W, H, T) {
  const pts = studio.rates ? studio.rates[studio.ccy] || [] : [];
  const x0 = W * .08, y0 = H * .32, w = W * .86, h = H * .46;
  if (pts.length < 2) {
    ctx.fillStyle = T.muted; ctx.font = `${W * .02}px sans-serif`; ctx.textAlign = "left";
    ctx.fillText("Kur verisi yükleniyor…", x0, y0 + h / 2); return;
  }
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * .15 || 1; lo -= pad; hi += pad;
  const X = i => x0 + i * w / (pts.length - 1), Y = v => y0 + (hi - v) * h / (hi - lo);
  const dec = vals[0] < 1000 ? 2 : 0;
  ctx.font = `${W * .014}px "Helvetica Neue", Arial, sans-serif`; ctx.textBaseline = "middle";
  for (let k = 0; k < 4; k++) {
    const v = lo + (hi - lo) * (k + .5) / 4;
    ctx.strokeStyle = T.soft; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x0 + w, Y(v)); ctx.stroke();
    ctx.fillStyle = T.muted; ctx.textAlign = "right"; ctx.fillText(v.toLocaleString("tr-TR", { maximumFractionDigits: dec }), x0 - 10, Y(v));
  }
  const g = ctx.createLinearGradient(0, y0, 0, y0 + h);
  g.addColorStop(0, T.primary + "40"); g.addColorStop(1, T.primary + "00");
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p[1])) : ctx.moveTo(X(i), Y(p[1])));
  ctx.lineTo(X(pts.length - 1), y0 + h); ctx.lineTo(X(0), y0 + h); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p[1])) : ctx.moveTo(X(i), Y(p[1])));
  ctx.strokeStyle = T.primary; ctx.lineWidth = W * .004; ctx.lineJoin = "round"; ctx.stroke();
  const L = pts.length - 1;
  ctx.fillStyle = T.primary; ctx.beginPath(); ctx.arc(X(L), Y(vals[L]), W * .007, 0, 7); ctx.fill();
  ctx.fillStyle = T.muted; ctx.textBaseline = "top";
  const d = s => s.slice(8, 10) + "." + s.slice(5, 7);
  ctx.textAlign = "left"; ctx.fillText(d(pts[0][0]), x0, y0 + h + 12);
  ctx.textAlign = "right"; ctx.fillText(d(pts[L][0]), x0 + w, y0 + h + 12);
}

function drawBoard(ctx, W, H, T) {
  const rows = studio.rates ? studio.rates.today : [];
  const order = ["USD", "EUR", "RUB", "TRY"];
  const wide = W / H > 1.3;
  const cols = wide ? 4 : 2, gap = W * .02;
  const x0 = W * .06, y0 = H * (wide ? .36 : .32), tw = (W * .88 - gap * (cols - 1)) / cols, th = H * (wide ? .4 : .24);
  order.forEach((c, i) => {
    const r = rows.find(x => x.ccy === c);
    const x = x0 + (i % cols) * (tw + gap), y = y0 + Math.floor(i / cols) * (th + gap);
    ctx.fillStyle = T.soft; rrect(ctx, x, y, tw, th, W * .012); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = T.muted; ctx.font = `600 ${W * .02}px "Helvetica Neue", Arial, sans-serif`;
    ctx.fillText(`1 ${c}`, x + tw * .1, y + th * .14);
    ctx.fillStyle = T.ink; ctx.font = `800 ${W * (wide ? .036 : .055)}px "Helvetica Neue", Arial, sans-serif`;
    ctx.fillText(r ? r.rate.toLocaleString("tr-TR", { maximumFractionDigits: r.rate < 1000 ? 2 : 0 }) : "…", x + tw * .1, y + th * .38);
    if (r) {
      const up = r.diff > 0;
      ctx.fillStyle = up ? "#1e7a3c" : "#b3261e"; ctx.font = `600 ${W * .018}px "Helvetica Neue", Arial, sans-serif`;
      ctx.fillText(`${up ? "▲" : "▼"} ${Math.abs(r.diff).toLocaleString("tr-TR", { maximumFractionDigits: 2 })}`, x + tw * .1, y + th * .74);
    }
  });
}

function canvasPoint(e) {
  const cv = $("#cv"), r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
}
(function bindCanvas() {
  const cv = $("#cv");
  cv.addEventListener("pointerdown", e => {
    const [px, py] = canvasPoint(e);
    const el = [...studio.els].reverse().find(el => el._box && px >= el._box[0] && px <= el._box[0] + el._box[2] && py >= el._box[1] && py <= el._box[1] + el._box[3]);
    studio.selEl = el ? el.id : null;
    if (el) {
      const [W, H] = SIZES[studio.size];
      studio.drag = { el, dx: px - el.x * W, dy: py - el.y * H };
      cv.setPointerCapture(e.pointerId); cv.classList.add("drag");
    }
    draw(); markSelectedField();
  });
  cv.addEventListener("pointermove", e => {
    if (!studio.drag) return;
    const [px, py] = canvasPoint(e), [W, H] = SIZES[studio.size], d = studio.drag;
    d.el.x = Math.min(Math.max((px - d.dx) / W, 0), 1);
    d.el.y = Math.min(Math.max((py - d.dy) / H, 0), 1);
    draw();
  });
  const end = () => { studio.drag = null; cv.classList.remove("drag"); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
})();

function pdfTags(f) {

}

function readFile(file) {

  let j; try { j = await api(isV ? "/api/video/status" : "/api/deck/status", undefined, true); } catch (e) { return; }
  if (isV) vjob = j; else djob = j;
  if (j.state === "çalışıyor") { const t = setTimeout(() => pollJob(kind), 2000); if (isV) vTimer = t; else dTimer = t; }
  else {
    const st = await api("/api/state", undefined, true); S = st; sig = signature(st);
    if (j.state === "bitti") toast(isV ? "Video bülten hazır" : "Sunum bülteni hazır"); else if (j.state === "hata") toast(j.message, true);
    if (isV) vTimer = null; else dTimer = null;
  }
  if (page === "video") renderVideo();
}

}

function slideshow(start) {
  const list = S.slides || []; if (!list.length) return;
  let i = start;
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;cursor:pointer";
  ov.innerHTML = `<img style="max-width:100vw;max-height:100vh"><div style="position:fixed;bottom:14px;right:20px;color:#bbb;font-size:13px" id="ss-n"></div>
    <div style="position:fixed;bottom:14px;left:20px;color:#888;font-size:12px">← → ile ilerleyin · Esc ile çıkın</div>`;
  document.body.appendChild(ov);
  const show = () => { ov.querySelector("img").src = "/file?ref=slide:" + encodeURIComponent(list[i]); ov.querySelector("#ss-n").textContent = `${i + 1} / ${list.length}`; };
  const key = e => { if (e.key === "Escape") close(); if (e.key === "ArrowRight" || e.key === " ") { i = Math.min(i + 1, list.length - 1); show(); } if (e.key === "ArrowLeft") { i = Math.max(i - 1, 0); show(); } };
  const close = () => { document.removeEventListener("keydown", key); ov.remove(); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); };
  ov.onclick = e => { if (e.clientX > innerWidth / 2) { if (i === list.length - 1) return close(); i++; } else i = Math.max(i - 1, 0); show(); };
  document.addEventListener("keydown", key);
  if (ov.requestFullscreen) ov.requestFullscreen().catch(() => {});
  show();
}

      <button class="primary" id="nu-go">Ekle</button></div>`;
  $("#nu-go").onclick = async () => {
    try { renderUsers(await api("/api/users", { op: "add", institution: $("#nu-inst").value, username: $("#nu-user").value, name: $("#nu-name").value, role: $("#nu-role").value, password: $("#nu-pass").value }));
      toast("Kullanıcı eklendi — kullanıcı adı ve şifreyi birime güvenli yoldan iletin"); } catch (e) { toast(e.message, true); }
  };
  $$("#s-users [data-pw]").forEach(b => b.onclick = async () => { const p = prompt(`${b.dataset.pw} için yeni şifre (en az 8 karakter):`); if (!p) return;
    try { renderUsers(await api("/api/users", { op: "password", username: b.dataset.pw, password: p })); toast("Şifre değiştirildi"); } catch (e) { toast(e.message, true); } });
  $$("#s-users [data-ud]").forEach(b => b.onclick = async () => { if (!confirm(`${b.dataset.ud} silinsin mi?`)) return; renderUsers(await api("/api/users", { op: "delete", username: b.dataset.ud })); });
  const lan = data.network.lan, live = data.bound === "0.0.0.0";
  $("#s-net").innerHTML = `<h3>🌐 Ağ erişimi</h3>
    <div class="row"><label class="switch"><input type="checkbox" id="net-lan" ${lan ? "checked" : ""}><span></span></label>
      <span>Paneli ofis ağına aç (diğer birimler kendi bilgisayarlarından girebilsin)</span></div>
    <p class="hint">${live ? `<b style="color:var(--ok)">Açık.</b> Birimler şu adresi kullanır: <b>http://${esc(data.ip || "bu-bilgisayar")}:${data.port}</b> → kullanıcı adı ve şifre ile giriş.`
      : lan ? `<b style="color:var(--warn)">Ayar açık; etkin olması için paneli yeniden başlatın.</b> Sonra adres: <b>http://${esc(data.ip || "bu-bilgisayar")}:${data.port}</b>`
      : "Kapalı: panel yalnızca bu bilgisayardan açılır."}<br>
      Bu bilgisayar yönetici masasıdır; burada giriş istenmez. Ağdan girenler şifre ile girer. Bağlantı yerel ağ içindir (HTTPS değil); internete açmayın — uzaktaki birimler için kurum VPN'i kullanın.</p>`;
  $("#net-lan").onchange = async e => { renderUsers(await api("/api/users", { op: "network", lan: e.target.checked })); };
}

/* ======================================================================
   Kılavuz
   ====================================================================== */
function renderGuide() {
  $("#p-guide").innerHTML = `<div class="row" style="margin-bottom:10px"><span class="hint" style="flex:1">Kılavuz yeni sekmede de açılabilir ve PDF olarak indirilebilir.</span>
      <a href="/static/kilavuz.html" target="_blank" rel="noopener"><button class="ghost">Yeni sekmede aç ↗</button></a>
      <a href="/static/guide/Kullanim-Kilavuzu.pdf" download><button class="primary">⬇ Kılavuz PDF</button></a></div>
    <iframe src="/static/kilavuz.html" title="Kılavuz" style="width:100%;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>`;
}

/* ======================================================================
   Geçmiş
   ====================================================================== */
function renderHistory() {
  $("#p-history").innerHTML = `<div class="card"><div class="tl">${S.history.slice().reverse().map(h =>
    `<div><b>${esc(h.who)}</b> · ${esc(h.action)}<div class="when">${fmtTime(h.at)} · ${ago(h.at)}</div></div>`).join("") || '<div class="hint">Henüz işlem yok.</div>'}</div></div>`;
}

/* ======================================================================
   Kaydet / onayla / canlı güncelleme
   ====================================================================== */
async function save(quietToast) {
  try {
    const st = await api("/api/save", { items });
    load(st);
    const nw = warnCount();
    if (!quietToast) toast(nw ? `Kaydedildi · ${nw} rakam uyarısı` : "Kaydedildi · rakamlar kontrol edildi ✓", nw > 0);
  } catch (e) { toast(e.message, true); }
}
$("#btn-save").onclick = () => dirty ? save() : toast("Her şey kayıtlı ✓");
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (dirty) save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

$("#btn-approve").onclick = async () => {
  if (dirty) await save();
  const nw = warnCount();
  const langs = ["Türkçe"].concat(Object.keys(S.translations).filter(l => S.translations[l] === "güncel").map(l => LANG_NAMES[l]));
  const stale = Object.keys(S.translations).filter(l => S.translations[l] === "eski").map(l => LANG_NAMES[l]);
  const d = $("#dlg");
  d.innerHTML = `<h3>Bülteni onayla</h3>
    <ul><li>${items.length} haber, sayı ${esc(S.issue)} · ${items.filter(i => i.image).length} görsel</li>
      <li>Rakam uyarısı: ${nw ? `<b style="color:var(--warn)">${nw} – önce düzeltin</b>` : "yok ✓"}</li>
      <li>Üretilecek PDF'ler: ${langs.join(", ")}</li>
      ${stale.length ? `<li style="color:var(--warn)">${stale.join(", ")} çeviri eski olduğu için dahil edilmeyecek</li>` : ""}
      <li>Onaylayan: <b>${esc(who())}</b>${$("#who").value.trim() ? "" : ' <span class="hint">(sol alttan adınızı yazabilirsiniz)</span>'}</li></ul>
    <div class="row" style="justify-content:flex-end"><button id="dlg-no">Vazgeç</button>
      <button class="primary" id="dlg-yes" ${nw ? "disabled" : ""}>Onayla</button></div>`;
  d.showModal();
  $("#dlg-no").onclick = () => d.close();
  $("#dlg-yes").onclick = async () => {
    d.close();
    try {
      load(await api("/api/approve", {}));
      toast("Onaylandı · PDF'ler üretildi");
      location.hash = "pdfs";
    } catch (e) { toast(e.message, true); }
  };
};

async function poll() {
  if (document.hidden) return;
  try {
    const st = await api("/api/state", undefined, true);
    $("#live-dot").className = "dot"; $("#live-txt").textContent = "Canlı · " + new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const s = signature(st);
    if (s === sig) return;
    if (dirty) { // kullanıcının kaydedilmemiş değişikliklerine dokunma
      S = { ...st, drafts: S.drafts }; sig = s; renderChrome(); return;
    }
    feed = null;
    const typing = document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName);
    if (["studio", "report", "telegram", "settings", "video"].includes(page) || typing) { S = st; sig = s; items = JSON.parse(JSON.stringify(st.drafts.items)); renderChrome(); return; }
    load(st);
  } catch (e) { $("#live-dot").className = "dot off"; $("#live-txt").textContent = "Bağlantı yok"; }
}
if (!DEMO) setInterval(poll, 10000);

/* ---------- Arayüz dili (TR / UZ) ---------- */
let uiLang = "tr";
try { uiLang = localStorage.getItem("ui") || "tr"; } catch (e) {}
const urlUi = new URLSearchParams(location.search).get("ui");  // ör. /?ui=uz
if (urlUi) uiLang = urlUi;
const SKIP = new Set(["TEXTAREA", "INPUT", "SCRIPT", "STYLE", "SVG", "OPTION"]);
function uzText(k) {
  if (window.UZ_DICT[k]) return window.UZ_DICT[k];
  for (const [re, r] of window.UZ_RE) if (re.test(k)) return k.replace(re, r);
  return null;
}
function translateTree(root) {
  if (uiLang !== "uz" || !window.UZ_DICT) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => n.nodeType === 1 ? (SKIP.has(n.tagName) || n.closest(".news,.srcdoc,.hl-list,.tnode .tx,.repcard .tt,#cands,#items,iframe") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_SKIP) : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const k = n.nodeValue.trim(); if (!k) return; const v = uzText(k); if (v) n.nodeValue = n.nodeValue.replace(k, v); });
  (root.querySelectorAll ? root.querySelectorAll("[placeholder],[title]") : []).forEach(el => {
    ["placeholder", "title"].forEach(a => { const k = el.getAttribute(a); const v = k && uzText(k.trim()); if (v) el.setAttribute(a, v); });
  });
  root.querySelectorAll && root.querySelectorAll("option").forEach(o => { const v = uzText(o.textContent.trim()); if (v) o.textContent = v; });
}
new MutationObserver(ms => { if (uiLang !== "uz") return; ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) translateTree(n); else if (n.nodeType === 3 && n.parentNode) translateTree(n.parentNode); })); })
  .observe(document.body, { childList: true, subtree: true });
function setUi(l) {
  uiLang = l; try { localStorage.setItem("ui", l); } catch (e) {}
  document.documentElement.lang = l === "uz" ? "uz" : "tr";
  $$("#ui-lang button").forEach(b => { b.classList.toggle("on", b.dataset.ui === l); b.style.color = b.dataset.ui === l ? "#1d1d1f" : "#d9cfcc"; });
  if (l === "tr") { if (document.documentElement.dataset.uz) location.reload(); }
  else { document.documentElement.dataset.uz = "1"; translateTree(document.body); }
}
$$("#ui-lang button").forEach(b => b.onclick = () => setUi(b.dataset.ui));
$("#hdr-lang").onclick = () => setUi(uiLang === "uz" ? "tr" : "uz");

api("/api/state").then(st => { load(st); route(); setUi(uiLang); }).catch(e => toast(e.message, true));
loadReports().then(renderChrome).catch(() => {});
api("/api/telegram", undefined, true).then(t => { tg = t; renderChrome(); }).catch(() => {});
</script>
